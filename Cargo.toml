[workspace]
members = [
  "crates/mo-common",
  "crates/mo-charts",
  "crates/mo-operation-service",
  "crates/mo-presentation-operations",
  "crates/mo-standard-host",
  "crates/mo-native-io",
  "crates/mo-native-worker",
  "crates/mo-native-render",
  "crates/mo-native-export",
  "crates/mo-native-compute",
  "crates/mo-embedded-sdk",
  "crates/mo-timeline",
  "crates/mo-geometry",
  "crates/mo-raster",
  "crates/mo-image",
  "crates/mo-render",
  "crates/mo-presentation-compile",
  "crates/mo-presentation-delivery",
  "crates/mo-skia-sys",
  "crates/mo-unicode",
  "crates/mo-color",
  "crates/mo-font",
  "crates/mo-text",
  "crates/mo-harfbuzz-sys",
  "crates/mo-presentation-model",
  "crates/mo-presentation-edit",
  "crates/mo-presentation-template",
  "crates/mo-kernel-api",
  "crates/mo-wasm",
  "crates/mo-xml",
  "crates/mo-opc",
  "crates/mo-pptx",
  "crates/mo-presentation-source",
  "tools/mo-cli",
  "tools/mo-host",
  "tools/mo-host-compat-wasm",
  "tools/mo-text-worker",
  "tools/mo-raster-worker",
  "tools/mo-export-worker",
  "tools/mo-contract-codegen",
]
resolver = "3"

[workspace.package]
license = "Apache-2.0"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
serde_path_to_error = "=0.1.20"
mo-common = { path = "crates/mo-common" }
mo-charts = { path = "crates/mo-charts" }
mo-operation-service = { path = "crates/mo-operation-service" }
mo-presentation-operations = { path = "crates/mo-presentation-operations" }
mo-standard-host = { path = "crates/mo-standard-host" }
mo-native-io = { path = "crates/mo-native-io" }
mo-native-worker = { path = "crates/mo-native-worker" }
mo-native-render = { path = "crates/mo-native-render" }
mo-native-export = { path = "crates/mo-native-export" }
mo-native-compute = { path = "crates/mo-native-compute" }
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "std"] }
mo-embedded-sdk = { path = "crates/mo-embedded-sdk" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
mo-timeline = { path = "crates/mo-timeline" }
mo-geometry = { path = "crates/mo-geometry" }
mo-image = { path = "crates/mo-image" }
mo-raster = { path = "crates/mo-raster" }
mo-render = { path = "crates/mo-render" }
mo-presentation-compile = { path = "crates/mo-presentation-compile" }
mo-presentation-delivery = { path = "crates/mo-presentation-delivery" }
mo-skia-sys = { path = "crates/mo-skia-sys" }
mo-unicode = { path = "crates/mo-unicode" }
mo-color = { path = "crates/mo-color" }
mo-font = { path = "crates/mo-font" }
mo-text = { path = "crates/mo-text" }
mo-harfbuzz-sys = { path = "crates/mo-harfbuzz-sys" }
mo-presentation-model = { path = "crates/mo-presentation-model" }
mo-presentation-edit = { path = "crates/mo-presentation-edit" }
mo-presentation-template = { path = "crates/mo-presentation-template" }
mo-kernel-api = { path = "crates/mo-kernel-api" }
mo-xml = { path = "crates/mo-xml" }
mo-opc = { path = "crates/mo-opc" }
mo-pptx = { path = "crates/mo-pptx" }
mo-presentation-source = { path = "crates/mo-presentation-source" }
rawzip = "=0.5.1"
quick-xml = "=0.42.0"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
crc32fast = "=1.5.2"
wasm-bindgen = "=0.2.126"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
schemars = "=1.2.2"
sha2 = "=0.10.9"
thiserror = "=2.0.20"
proptest = "=1.11.0"
libm = { version = "=0.2.16", default-features = false, features = ["force-soft-floats"] }
read-fonts = { version = "=0.43.3", default-features = false, features = ["libm"] }
unicode-bidi = { version = "=0.3.18", default-features = false }
num-bigint = { version = "=0.4.8", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
overflow-checks = true
