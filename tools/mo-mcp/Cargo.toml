[workspace]

[package]
license = "Apache-2.0"
name = "mo-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
default-run = "mo-mcp"

[features]
default = []
http = ["rmcp/transport-streamable-http-server", "dep:axum", "dep:http-body", "dep:http-body-util", "tokio/net", "tokio/signal"]
legacy-host = ["dep:mo-opc", "dep:mo-operation-service", "dep:mo-standard-host", "dep:mo-native-render", "dep:rusqlite"]

[[bin]]
name = "mo-mcp"
path = "src/main.rs"

[[bin]]
name = "mo-mcp-legacy"
path = "src/legacy_main.rs"
required-features = ["legacy-host"]

[[bin]]
name = "mo-mcp-http"
path = "src/http_main.rs"
required-features = ["http"]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"], optional = true }
http-body = { version = "=1.1.0", optional = true }
http-body-util = { version = "=0.1.4", optional = true }
mo-embedded-sdk = { path = "../../crates/mo-embedded-sdk" }
mo-native-compute = { path = "../../crates/mo-native-compute" }
schemars = "=1.2.2"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"], optional = true }
mo-common = { path = "../../crates/mo-common" }
mo-opc = { path = "../../crates/mo-opc", optional = true }
mo-operation-service = { path = "../../crates/mo-operation-service", optional = true }
mo-standard-host = { path = "../../crates/mo-standard-host", optional = true }
mo-native-render = { path = "../../crates/mo-native-render", optional = true }
rmcp = { version = "=3.4.1", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "=1.53.1", features = ["rt", "macros", "io-util", "time", "sync"] }
tokio-util = { version = "=0.7.19", features = ["codec"] }
futures = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"

[target.'cfg(unix)'.dependencies]
tokio = { version = "=1.53.1", features = ["net"] }

[target.'cfg(not(unix))'.dependencies]
tokio = { version = "=1.53.1", features = ["io-std"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
overflow-checks = true
