[workspace]

[package]
license = "Apache-2.0"
name = "mo-mcp-sdk-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
mo-operation-service = { path = "../../../crates/mo-operation-service" }
rmcp = { version = "=3.4.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "=1.53.1", features = ["rt", "macros", "io-std"] }
tokio-util = { version = "=0.7.19", features = ["codec"] }
futures = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
schemars = "=1.2.2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
overflow-checks = true
