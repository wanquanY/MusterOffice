name: Feature request / 功能建议
description: Describe an office workflow or integration capability.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User or agent task / 用户或 Agent 任务
      description: What are you trying to accomplish? What prevents it today?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Desired behavior and acceptance / 目标行为与验收
      description: Include representative inputs, expected output and compatibility needs.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints / 替代方案与约束
