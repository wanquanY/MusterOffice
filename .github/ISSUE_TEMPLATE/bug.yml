name: Bug report / 缺陷报告
description: Report a reproducible problem in MusterOffice.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'For security vulnerabilities, use [private reporting](https://github.com/wanquanY/MusterOffice/security/advisories/new). Do not upload confidential presentations or credentials.'
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior / 预期与实际行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction / 最小复现
      description: Commands, sanitized inputs, errors and optional screenshots.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 运行环境
      description: Commit, OS/architecture, CLI/SDK/MCP/WASM, component versions and explicit fonts.
    validations:
      required: true
