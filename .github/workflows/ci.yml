name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/ci/requirements.txt
      - run: python tools/ci/check_repository.py
      - run: python -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Validate workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color

  verification:
    name: Rust, native, WASM and clients
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MO_SKIA_LIB_DIR: ${{ github.workspace }}/.codex-work/ci-native/skia
      MO_HARFBUZZ_LIB_DIR: ${{ github.workspace }}/.codex-work/ci-native/harfbuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang llvm cmake ninja-build nasm pkg-config
          python -m pip install -r tools/ci/requirements.txt
          npm install --global pnpm@10.2.1
          rustup show
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: native-cache
        with:
          path: .codex-work/ci-native
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('components/**', 'tools/components/*.py', 'tools/ci/prepare_native.py', 'tools/verification/*probe.cpp') }}
      - name: Build verified native components
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: python tools/ci/prepare_native.py
      - name: Cache verified native components
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .codex-work/ci-native
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --manifest-path tools/mo-mcp/Cargo.toml --locked
          pnpm install --frozen-lockfile
          cargo install wasm-bindgen-cli --version 0.2.126 --locked --root .codex-work/bindgen
      - name: Run all current verification gates
        run: |
          python tools/verification/current.py \
            --output .codex-work/ci-verification \
            --bindgen "$GITHUB_WORKSPACE/.codex-work/bindgen/bin/wasm-bindgen"
      - name: Verify README workflow and templates
        run: python tools/ci/smoke.py
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .codex-work/ci-verification/report.json
            .codex-work/ci-verification/*.log
            .codex-work/ci-smoke/*.json
            .codex-work/ci-native/*/*-build.log
          retention-days: 14

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  gate:
    name: CI required
    if: always()
    needs: [repository, verification, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REPOSITORY_RESULT: ${{ needs.repository.result }}
      VERIFICATION_RESULT: ${{ needs.verification.result }}
      DEPENDENCY_RESULT: ${{ needs.dependencies.result }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Require successful checks
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$VERIFICATION_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$DEPENDENCY_RESULT" = success
          else
            test "$DEPENDENCY_RESULT" = skipped
          fi
