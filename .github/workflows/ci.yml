name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/ci/requirements.txt
      - run: python tools/ci/check_repository.py
      - run: python -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Validate workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color

  verification:
    name: Rust, native, WASM and clients
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MO_SKIA_LIB_DIR: ${{ github.workspace }}/.codex-work/ci-native/skia
      MO_HARFBUZZ_LIB_DIR: ${{ github.workspace }}/.codex-work/ci-native/harfbuzz
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang llvm cmake ninja-build nasm pkg-config
          python -m pip install -r tools/ci/requirements.txt
          npm install --global pnpm@10.2.1
          rustup show
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: native-cache
        with:
          path: .codex-work/ci-native
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('components/**', 'tools/components/**', 'tools/ci/prepare_native.py', 'tools/verification/*probe.cpp') }}
      - name: Build verified native components
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: python tools/ci/prepare_native.py
      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked
          cargo fetch --manifest-path tools/mo-mcp/Cargo.toml --locked
          pnpm install --frozen-lockfile
          cargo install wasm-bindgen-cli --version 0.2.126 --locked --root .codex-work/bindgen
      - name: Run all current verification gates
        run: |
          python tools/verification/current.py \
            --output .codex-work/ci-verification \
            --bindgen "$GITHUB_WORKSPACE/.codex-work/bindgen/bin/wasm-bindgen"
      - name: Verify README workflow and templates
        run: python tools/ci/smoke.py
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .codex-work/ci-verification/report.json
            .codex-work/ci-verification/*.log
            .codex-work/ci-smoke/*.json
            .codex-work/ci-native/*/*-build.log
          retention-days: 14

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  gate:
    name: CI required
    if: always()
    needs: [repository, verification, dependencies]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REPOSITORY_RESULT: ${{ needs.repository.result }}
      VERIFICATION_RESULT: ${{ needs.verification.result }}
      DEPENDENCY_RESULT: ${{ needs.dependencies.result }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Require successful checks
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$VERIFICATION_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$DEPENDENCY_RESULT" = success
          else
            test "$DEPENDENCY_RESULT" = skipped
          fi
