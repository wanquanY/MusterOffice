version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directories: ['/', '/tools/mo-mcp', '/tools/experiments/mcp-sdk-probe']
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /tools/ci
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /tools/release
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
